# Vhost HTTP temporaneo: serve solo per la challenge ACME di Let's Encrypt.
# Dopo il rilascio del certificato si monta deploy/noir.conf al suo posto.
server {
    listen 80;
    server_name noir.salonix.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404;
    }
}
